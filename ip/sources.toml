# Fonti escluse (non ridistribuibili, non configurate):
# - Spamhaus DROP: nessuna licenza concessa, uso commerciale solo con Spamhaus Technology
# - Team Cymru fullbogons: ridistribuzione vietata → usare il blocco bogon nativo di pfSense/OPNsense
# - RIR delegated stats (liste per paese): ridistribuzione non concessa da RIPE NCC → usare GeoIP nativo dei firewall
# - CERT-AgID feed IoC: solo PA accreditate, uso commerciale vietato
# - bitwire-it/ipblocklist, romainmarcoux/malicious-ip: repo MIT ma aggregano fonti NC/AGPL/Spamhaus
#   (bitwire lo dichiara: "usage subject to the licenses of the original data providers")
# - abuse.ch SSLBL/ThreatFox, GreenSnow, Botvrij, C2IntelFeeds (NC), binarydefense ATIF: termini incompatibili
# - Cloudflare ips-v4/v6, GitHub meta: nessuna licenza di ridistribuzione dichiarata
