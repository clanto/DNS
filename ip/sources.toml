# Configurazione feed IP per firewall.
# Aggiungere una fonte qui = tutti i firewall la ricevono al prossimo build, senza toccare i dispositivi.
# Ogni fonte deve avere licenza verificata e compatibile con GPL-3.0 e uso commerciale prima di "enabled = true".
# Licenze verificate il 2026-09-24.

[settings]
min_prefix_v4 = 16        # reti più ampie di /16 scartate (evita blocchi di interi provider)
min_prefix_v6 = 32
max_drop_ratio = 0.5      # se una fonte cala oltre il 50% rispetto all'ultima versione, si tiene la cache
pr_threshold = 0.25       # variazione oltre il 25% su un feed → PR da approvare invece del commit diretto
anomaly_min_entries = 100 # sotto questa soglia i feed non generano anomalie (liste manuali piccole)
max_entries = 0           # 0 = nessun limite; >0 segnala i feed che superano i limiti dei firewall
source_max_age_days = 7   # fonte il cui contenuto non cambia da più giorni → controllo giornaliero fallito (max_age_days per fonte)

# ---------------------------------------------------------------------------
# Categorie: ognuna produce dist/ip/<categoria>-v4.txt e -v6.txt (URL stabili).
# reserved = true accetta reti private/riservate e non applica l'allowlist (solo bogon).
# exclude_shared = true non blocca mai IP di CDN/hosting condivisi ([[shared_sources]] e ip/condivisi.txt).
# ---------------------------------------------------------------------------

[categories.doh]
description = "Resolver DNS-over-HTTPS/TLS pubblici: impediscono il bypass del DNS aziendale"
compat_v4 = ["DNSoverHTTPS/ipv4.txt"]
exclude_shared = true  # le fonti DoH includono IP CDN condivisi (es. AWS Global Accelerator di argoeducation.com)

[categories.tor]
description = "Rete Tor: nodi di uscita e relay (blocca sia gli attacchi da Tor sia l'uso di Tor Browser)"

[categories.threat]
description = "IP malevoli attivi (scanner, brute force, attacchi) segnalati da più blacklist"
exclude_shared = true  # un IP di CDN condivisa non è un attaccante: bloccarlo rompe siti legittimi

[categories.c2]
description = "Server di comando e controllo di botnet e malware"
exclude_shared = true  # gli IoC possono puntare a hosting condivisi

[categories.vpn]
description = "VPN commerciali e proxy anonimizzanti"
exclude_shared = true

[categories.social]
description = "Social network e messaggistica per AS: Meta (Facebook, Instagram, WhatsApp), TikTok, X, Telegram"
# Non in all/all-scuole: blocca anche WhatsApp. Alias separato dove serve (es. scuole).

[categories.inbound]
description = "IP che attaccano servizi esposti (scanner, brute force): SOLO in ingresso WAN → LAN"
exclude_shared = true

[categories.bogon]
description = "Reti riservate/private (RFC 6890): SOLO in ingresso su interfacce WAN, mai su LAN"
reserved = true

# ---------------------------------------------------------------------------
# Infrastrutture condivise: intervalli ufficiali di CDN/hosting usati solo per il filtro exclude_shared
# (e per le liste OPNsense). Non vengono pubblicati né salvati in cache: se non sono raggiungibili il
# build fallisce e restano online i feed precedenti.
# format: text (un CIDR per riga) | aws (ip-ranges.json, con services) | fastly (public-ip-list) | google (goog.json) | asn (asns)
# subtract_url: reti da togliere dall'infrastruttura; keep: reti che restano comunque bloccabili
# ---------------------------------------------------------------------------

[[shared_sources]]
id = "cloudflare-v4"
url = "https://www.cloudflare.com/ips-v4"
format = "text"

[[shared_sources]]
id = "cloudflare-v6"
url = "https://www.cloudflare.com/ips-v6"
format = "text"

[[shared_sources]]
id = "aws"
url = "https://ip-ranges.amazonaws.com/ip-ranges.json"
format = "aws"
services = ["CLOUDFRONT", "GLOBALACCELERATOR"]

[[shared_sources]]
id = "fastly"
url = "https://api.fastly.com/public-ip-list"
format = "fastly"

[[shared_sources]]
id = "cdn-asn"
format = "asn"
# CDN e hosting condivisi senza elenco pubblico completo (reti da iptoasn.com, PDDL).
# Esclusi di proposito AWS, Azure, Google Cloud, Gcore: ospitano VM dedicate usate anche per attacchi.
asns = [20940, 16625, 21342,   # Akamai
        32787,                 # Prolexic (Akamai)
        36459,                 # GitHub Pages
        19551,                 # Imperva Incapsula
        200325,                # BunnyCDN
        54113,                 # Fastly (anche Firebase Hosting)
        13335,                 # Cloudflare
        15169]                 # Google front-end (Gmail, Workspace, App Engine, Blogger)
# keep (vale su tutte le fonti condivise): resolver pubblici con IP dedicati dentro reti condivise,
# che devono restare bloccati nel feed doh
keep = ["8.8.8.8/32", "8.8.4.4/32", "2001:4860:4860::/64",                    # Google Public DNS
        "1.1.1.1/32", "1.1.1.2/31", "1.0.0.1/32", "1.0.0.2/31", "2606:4700:4700::/48"]  # Cloudflare 1.1.1.1

[[shared_sources]]
id = "google"
url = "https://www.gstatic.com/ipranges/goog.json"
format = "google"
subtract_url = "https://www.gstatic.com/ipranges/cloud.json"  # le VM Google Cloud hanno IP dedicati
# I front-end Google servono insieme Gmail/SMTP, Workspace, App Engine, Firebase, Cloud Run, Blogger:
# un dominio VPN su *.web.app o *.appspot.com risolverebbe su IP condivisi con smtp.gmail.com.
# keep: resolver Google Public DNS, che restano bloccati nel feed doh (keep vale su tutte le fonti).
keep = ["8.8.8.8/32", "8.8.4.4/32", "2001:4860:4860::/64"]

# ---------------------------------------------------------------------------
# Provider DNS con AS dedicato: le loro reti stanno in ip/custom/<categoria>.txt e un controllo
# settimanale (scripts/check_asn.py) segnala reti nuove annunciate dall'AS. Solo AS che fanno
# esclusivamente DNS: mai provider con altri servizi sulla stessa rete (AdGuard, Cloudflare, Google).
# ---------------------------------------------------------------------------

[[asn_checks]]
asn = 34939
name = "NextDNS, Inc."
category = "doh"

# ---------------------------------------------------------------------------
# Feed aggregati: dist/ip/<nome>-v4.txt e -v6.txt, unione delle categorie elencate.
# ---------------------------------------------------------------------------

[aggregates.all]
description = "Aziende: uscita e ingresso"
categories = ["doh", "tor", "threat", "c2"]

[aggregates.all-scuole]
description = "Scuole: come all, più VPN commerciali e proxy"
categories = ["doh", "tor", "threat", "c2", "vpn"]

