# Aggiornamento automatico delle GitHub Actions (versioni fissate per SHA): una PR a settimana da approvare.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
