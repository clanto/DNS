name: Build feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ip/sources.toml"
      - "ip/custom/**"
      - "ip/allowlist.txt"
      - "domains/**"
      - "scripts/**"
      - "docs/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages: ${{ steps.sito.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Genera feed
        id: build
        run: python scripts/build_ip.py --report "$RUNNER_TEMP/report.md"

      - name: Genera liste domini
        id: allow
        continue-on-error: true
        run: python scripts/build_domains.py --report "$RUNNER_TEMP/report.md"

      - name: Genera liste FQDN per OPNsense
        continue-on-error: true
        run: python scripts/build_opnsense.py

      - name: Genera SafeSearch per Unbound
        continue-on-error: true
        run: python scripts/build_safesearch.py

      - name: Catalogo e attribuzioni
        continue-on-error: true
        run: python scripts/build_index.py

      - name: Registro variazioni
        continue-on-error: true
        run: python scripts/changelog.py

      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
          # anomalia dei feed IP o calo oltre soglia di una lista strict (build_domains.py): PR invece del push
          ANOMALY: ${{ steps.build.outputs.anomaly == 'true' || steps.allow.outputs.anomaly == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A dist ip/cache domains/cache DNSoverHTTPS/ipv4.txt
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai feed"
            exit 0
          fi
          msg="feed: aggiornamento liste $(date -u +%F)"
          if [ "$ANOMALY" = "true" ]; then
            open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("ip-update/"))] | length')
            if [ "$open" != "0" ]; then
              echo "::warning::Variazione anomala, ma esiste già una PR ip-update aperta: nessuna nuova PR"
              exit 0
            fi
            branch="ip-update/$(date -u +%Y%m%d-%H%M)"
            git switch -c "$branch"
            git commit -m "$msg (variazione anomala)"
            git push origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "$msg: variazione anomala da verificare" \
              --body-file "$RUNNER_TEMP/report.md"
          else
            git commit -m "$msg"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Sito GitHub Pages: docs/ + indice «Perché è bloccato?» (dist/perche è in .gitignore, mai nella storia git).
      # Solo quando il build pubblica su main: con una variazione anomala l'indice aspetta la revisione della PR.
      - name: Prepara il sito Pages
        id: sito
        if: steps.build.outputs.anomaly != 'true' && steps.allow.outputs.anomaly != 'true' && hashFiles('dist/perche/meta.json') != ''
        run: |
          site="$RUNNER_TEMP/sito"
          mkdir -p "$site"
          cp -r docs/. "$site/"
          cp -r dist/perche "$site/perche"
          echo "pages=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.sito.outputs.pages == 'true'
        with:
          path: ${{ runner.temp }}/sito

      - name: Segnala errori nelle liste manuali
        if: steps.build.outputs.errors != '0' || steps.allow.outcome == 'failure'
        run: |
          echo "::error::Righe non valide nelle liste manuali: ignorate, vedi il riepilogo del job"
          exit 1

  pages:
    needs: build
    # anche se il build segnala righe manuali errate (job fallito dopo la pubblicazione delle liste)
    if: ${{ !cancelled() && needs.build.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
