name: Verifica settimanale liste

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "domains/allowlist/**"
      - "domains/blocklist/**"
      - "ip/custom/**"
      - "ip/sources.toml"
      - "domains/domains.toml"

permissions:
  contents: write        # solo per la PR di pulizia, aperta solo fuori dalle PR
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sulle PR gli script vengono dal ramo proposto: il token non resta in .git/config
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installa dig
        run: command -v dig || (sudo apt-get update && sudo apt-get install -y dnsutils)

      - name: Verifica esistenza domini e conflitti con liste di bypass
        env:
          FIX: ${{ github.event_name != 'pull_request' && '--fix' || '' }}
        run: python scripts/check_domains.py $FIX | tee "$RUNNER_TEMP/domini.md"

      - name: Apri PR con la pulizia dei domini morti
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- domains/blocklist; then
            echo "Nessun dominio morto da togliere"
            exit 0
          fi
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("pulizia-domini/"))] | length')
          if [ "$open" != "0" ]; then
            echo "::warning::Esiste già una PR di pulizia aperta: nessuna nuova PR"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git  # credenziali solo per il push di questo step (checkout senza persist-credentials)
          branch="pulizia-domini/$(date -u +%Y%m%d)"
          git switch -c "$branch"
          git add domains/blocklist
          git commit -m "domini: rimozione voci manuali non più esistenti (NXDOMAIN su due resolver)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Pulizia blocklist manuali: domini non più esistenti" \
            --body-file "$RUNNER_TEMP/domini.md"

      - name: Verifica reti dei provider DNS dedicati
        if: always()
        run: python scripts/check_asn.py

      - name: Verifica IP risolti dalle liste OPNsense
        if: always()
        run: python scripts/check_opnsense_ips.py
