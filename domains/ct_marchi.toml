# Lista block-phishing-it da Certificate Transparency (scripts/ct_phishing_it.py, workflow ct-phishing.yml).
# Cerca nei log CT i certificati emessi di recente per nomi che imitano marchi e servizi italiani.
#
# FASE DI OSSERVAZIONE: con osservazione = true i candidati NON entrano in nessuna blocklist pubblicata.
# Il workflow scrive solo in dist/osservazione/ (candidati, report con motivo e punteggio, stato con primo
# avvistamento). Con osservazione = false build_domains.py pubblica i candidati sopra soglia come
# categoria block.phishing-it (dist/adguard/block-phishing-it.txt e formati semplici), come le altre liste.
osservazione = true

soglia = 60            # punteggio minimo per essere candidato
finestra_giorni = 3    # certificati con not_before negli ultimi N giorni (il workflow è giornaliero)
scadenza_giorni = 7    # un candidato che non risolve più da N giorni esce (il phishing vive poco)

# Parole esca nel nome (login, verifica, rimborso...): aumentano il punteggio
esca = ["accedi", "accesso", "login", "logon", "signin", "verifica", "verify", "rimborso", "rimborsi",
        "sblocco", "sblocca", "conferma", "aggiorna", "aggiornamento", "update", "sicurezza", "sicuro",
        "secure", "assistenza", "supporto", "support", "clienti", "cliente", "account", "areaclienti",
        "pagamento", "pagamenti", "paga", "fattura", "bolletta", "multa", "spedizione", "pacco", "consegna",
        "tracking", "giacenza", "notifica", "avviso", "scadenza", "documenti", "identita", "bonus",
        "premio", "rimborsoweb", "online", "web", "app", "servizi", "conto", "carta", "bank", "banca",
        "pec", "recupero", "attiva", "attivazione", "abilita", "abilitazione", "autenticazione", "otp"]

# Segnali di contesto italiano, richiesti per i marchi globali (richiede_segnale_it = true)
segnali_it = ["it", "ita", "italia", "italy", "italiane", "accedi", "accesso", "verifica", "rimborso",
              "sblocco", "conferma", "aggiorna", "sicurezza", "assistenza", "clienti", "pagamento",
              "fattura", "bolletta", "spedizione", "pacco", "consegna", "giacenza", "notifica", "avviso"]

tld_rischio = ["top", "xyz", "shop", "online", "site", "live", "icu", "click", "info", "cfd", "sbs",
               "rest", "bond", "cyou", "buzz", "monster", "quest", "lol", "support", "help", "link", "cc",
               "ws", "pw", "tk", "ml", "ga", "cf", "gq", "club", "store", "life", "space", "website",
               "fun", "center", "services", "today", "vip", "work", "cam", "mom", "beauty", "hair", "skin"]

# Suffissi pubblici a due livelli più comuni (la sezione privata della PSL arriva da domains/cache)
suffissi_icann = ["co.uk", "org.uk", "com.au", "com.br", "com.ar", "com.mx", "com.tr", "com.cn", "com.ru",
                  "co.za", "co.jp", "co.in", "co.kr", "com.pl", "com.ua", "com.co", "com.pe", "com.es",
                  "gov.it", "edu.it", "gov.uk", "ac.uk", "net.br", "org.br", "co.nz", "com.sg", "com.hk",
                  "com.my", "com.vn", "com.ng", "com.pk", "com.eg", "com.sa", "co.id", "co.il", "co.th"]

# ---------------------------------------------------------------------------
# Fonte CT: crt.sh (Sectigo), interfaccia JSON pubblica, senza chiave API.
# Termini verificati (ottobre 2026): crt.sh non pubblica termini d'uso né limiti ufficiali per l'API JSON,
# che non è versionata né supportata formalmente. L'operatore ha dichiarato sul gruppo crtsh (giugno 2023)
# un limite di 5 richieste al minuto per IP su HTTPS e 5 connessioni concorrenti su PostgreSQL; superarlo
# o caricare troppo il servizio produce errori 502/429 e blocchi temporanei.
# Uso conforme: richieste in serie, una ogni pausa_secondi (4 al minuto), retry con backoff esponenziale
# sugli errori, budget di tempo complessivo, User-Agent che identifica il repository; un solo giro al giorno.
#
# Ricerca: solo per PREFISSO del nome (identity=prefisso%&match=LIKE: postepay% trova postepay-sblocco.com
# e postepay.esempio.com; il '-' nel prefisso è ammesso). Le ricerche a parola libera di crt.sh (q=, FTS)
# non indicizzano le etichette dei nomi a dominio e quelle con '%' iniziale vengono ridotte a ricerche per
# organizzazione: non trovano i certificati DV usati dal phishing. Un marchio in mezzo al nome
# (accedi-postepay.com) si trova solo se il nome inizia con un prefisso cercato, compresi i prefissi_esca.
# Per i prefissi molto generici crt.sh restituisce un sottoinsieme (alcune migliaia di certificati, non
# sempre i più recenti): per i marchi corti si cercano forme specifiche (tim-, enel-, brt-, mytim...).
# ---------------------------------------------------------------------------
[fonte]
nome = "crt.sh"
url = "https://crt.sh/?identity={q}&match=LIKE&output=json&exclude=expired"
pausa_secondi = 15
timeout_secondi = 120
tentativi = 4          # backoff 30 s, 60 s, 120 s
budget_minuti = 45     # oltre, le ricerche restanti si saltano (riprendono il giorno dopo)

# Prefissi generici di esca: utili solo se il nome contiene anche un marchio (rimborso-inps.com)
prefissi_esca = ["rimborso", "sblocco", "areaclienti", "verifica"]

[punteggio]
marchio_dominio = 45      # marchio nel dominio registrabile (o nel sottodominio di una piattaforma PSL)
marchio_sottodominio = 20 # marchio solo in un sottodominio di un dominio qualsiasi: spesso legittimo
variante = 50             # typo o omoglifo del marchio (cifre, Unicode, rn→m) al posto del nome esatto
esca = 15                 # per ogni parola esca, al massimo esca_max
esca_max = 2
tld_rischio = 15
cert_recente = 5          # certificato emesso da al massimo 2 giorni
wildcard = 5
dv_gratuito = 5           # Let's Encrypt, ZeroSSL, Google Trust Services, cPanel
organizzazione = -40      # certificato OV/EV (organizzazione verificata): quasi sempre il titolare vero

# ---------------------------------------------------------------------------
# Marchi. Campi:
#   cerca       prefissi per crt.sh (default: le parole). Mai troppo generici: ogni prefisso è una richiesta.
#   parole      nomi del marchio senza separatori. Da 5 caratteri: cercate dentro le etichette (anche
#               typo a distanza 1 dalle 6 lettere); più corte: solo come token separato da '-' o unito a una
#               parola esca o a 'it'/'italia' (inps-rimborso, inpsrimborso).
#   varianti    typo e storpiature note, trattate come variante.
#   token       parole comuni anche fuori dal marchio (poste, fineco, aruba): solo come token o unite a
#               una parola esca, mai dentro un'altra parola (poster, finecoding, arubanetworks).
#   non_marchio parole comuni che contengono il marchio e vanno ignorate (poster contiene poste).
#   ufficiali   domini del titolare: loro e i sottodomini non sono mai segnalati.
#   richiede_segnale_it  marchio globale: candidato solo con un segnale italiano nel nome.
# ---------------------------------------------------------------------------

